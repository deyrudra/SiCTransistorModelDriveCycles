# Tesla Model 3 Premium Long Range Rear-Wheel Drive
# Vehicle-layer validation target: Tesla Germany WLTP combined
#
# Official trim-level values used here:
#   mass_kg: 1822
#   rear motor power: 235 kW
#   official WLTP combined consumption: 13.6 kWh/100 km = 136 Wh/km
#
# IMPORTANT:
# Cd, frontal area, rolling resistance, drivetrain efficiencies,
# inverter/device parameters, thermal parameters, and reliability parameters
# below are still modelling assumptions unless explicitly calibrated later.

vehicle:
  name: tesla_model3_premium_long_range_rwd_de_wltp
  mass_kg: 1822
  frontal_area_m2: 2.22
  drag_coefficient: 0.23
  rolling_resistance_coefficient: 0.010

powertrain:
  drivetrain_efficiency: 0.92
  regenerative_efficiency: 0.80

  # Tesla Germany lists 235 kW rear power for this trim.
  max_propulsion_power_w: 235000

  max_regen_power_w: 90000

  # Regen blending assumptions for model validation.
  # These are NOT Tesla-published calibration values yet.
  # Regen is zero at/below 1.5 m/s (~5.4 km/h), then fades linearly
  # to full configured regen availability at 5.0 m/s (~18 km/h).
  regen_cutoff_speed_mps: 1.5
  regen_full_speed_mps: 5.0

  # These are simulation/driver limits, not Tesla certification figures.
  max_acceleration_mps2: 1.8
  comfortable_braking_mps2: 2.5
  emergency_braking_mps2: 6.0

driver:
  safe_distance_m: 5.0
  time_headway_s: 1.5

validation:
  benchmark_name: Tesla Model 3 Premium Long Range Rear-Wheel Drive
  market: Germany
  certification_cycle: WLTP_combined
  official_consumption_kwh_per_100km: 13.6
  official_consumption_wh_per_km: 136.0
  official_mass_kg: 1822
  official_rear_motor_power_kw: 235
  benchmark_purpose: vehicle_layer_validation

inverter:
  dc_bus_voltage_v: 345.5
  switching_frequency_hz: 10000
  max_phase_current_a_peak: 700
  parallel_devices_per_switch: 4
  modulation_factor: 0.90

mosfet:
  # Electrical values are still illustrative until a specific SiC device is selected.
  rds_on_ohm_at_25c: 0.020
  rds_on_temperature_exponent: 1.273
  eon_reference_j: 0.000486
  eoff_reference_j: 0.000506
  switching_reference_current_a: 50
  switching_reference_voltage_v: 520
  tj_reference_c: 25.0
  tj_max_c: 200.0

  thermal:
    # Foster-network sum = 0.42 C/W.
    # Still illustrative until fitted to a selected device's Zth(j-c) curve.
    rth_jc_c_per_w: 0.42
    rth_case_to_coolant_c_per_w: 0.05

    foster_rc_pairs:
      - rth_c_per_w: 0.0216
        tau_s: 0.000077

      - rth_c_per_w: 0.0703
        tau_s: 0.001554

      - rth_c_per_w: 0.1668
        tau_s: 0.016634

      - rth_c_per_w: 0.1613
        tau_s: 0.142761

    max_iterations: 30
    convergence_tolerance_c: 0.01
    relaxation: 0.5

cooling:
  coolant_inlet_temp_c: 65.0

reliability:
  model: coffin_manson_arrhenius

  # Do not use this section for absolute lifetime prediction yet.
  calibrated: false
  calibration_source: null

  delta_t_reference_c: 40.0
  mean_tj_reference_c: 100.0
  coffin_manson_exponent: 5.0
  activation_energy_ev: 0.7
  minimum_delta_t_c: 0.01
